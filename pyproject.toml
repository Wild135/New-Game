[project]
name = "rocket-empire"
version = "1.0.0"
description = "Rocket Empire: Idle Space Tycoon - a 2D idle factory game made with pygame-ce"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pygame-ce>=2.5.0", "numpy>=1.26"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pyinstaller>=6.0"]

[project.scripts]
rocket-empire = "game.app:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
